<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Color Models</h1>

    <div class="swatch named-color">
        <h2>Named Color</h2>
        <p>Blue</p>
    </div>

    <div class="swatch hex-color">
        <h2>HEX</h2>
        <p>#FF5733</p>
    </div>

    <div class="swatch rgb-color">
        <h2>RGB</h2>
        <p>rgb(46, 204, 113)</p>
    </div>

    <div class="swatch rgba-color">
        <h2>RGBA</h2>
        <p>rgba(155, 89, 182, 0.5)</p>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">
        <div class="opacity-box">
            <p>Opacity: 0.5</p>
            <strong>Child text is also faded</strong>
        </div>

        <div class="rgba-box">
            <p>RGBA: 0.5</p>
            <strong>Child text stays solid</strong>
        </div>
    </div>

</body>
</html>
