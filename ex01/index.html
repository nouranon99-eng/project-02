<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>My Website</h1>
        <a href="#">Home</a>
    </nav>

    <main>
        <h2>Positioning Cards</h2>

        <div class="card-container">
            <div class="card">
                <span class="badge">New</span>
                <h3>Card 1</h3>
                <p>This card has an absolute notification badge.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>This is another card.</p>
            </div>
        </div>
    </main>

    <a href="#" class="back-to-top">↑</a>

</body>
</html>
